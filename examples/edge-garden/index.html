<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>边缘花园</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><strong>边缘花园</strong></header>
<div class="garden" aria-label="花园守护者"><i class="plant"><b></b></i><i class="plant tall"><b></b></i><i class="plant"><b></b></i><progress id="patrolProgress" max="10000" value="0" aria-label="下一轮巡逻进度"></progress><span id="heroStats">读取进度…</span></div>
<nav aria-label="花园布局"><button id="expand">展开</button><button id="orient">纵向</button></nav>
<section id="details"><h1>花园守护者</h1><div class="gameActions"><button id="pauseGame" disabled>暂停巡逻</button><button id="inventoryTab" aria-pressed="true">背包</button><button id="skillTab" aria-pressed="false">技能</button><button id="testSound">试音</button></div><p id="inventoryPanel"><span id="inventoryCounts"></span><span id="experienceLabel"></span><progress id="experienceProgress" max="30" value="0" aria-label="本级经验"></progress>每十秒巡逻一次，收获金币和种子。<button id="sellSeed" disabled>售出种子 +5</button></p><p id="skillPanel" hidden>阳光技能提高巡逻收益。<button id="trainSkill" disabled>训练</button></p><div class="gameActions"><button id="saveGame" disabled>保存进度</button><button id="restoreGame" disabled>恢复上次</button><button id="exportGame" disabled>导出备份</button><button id="retryGame" hidden>重新读取</button></div><output id="recoverySummary" aria-live="polite" hidden></output><output id="saveStatus" aria-live="polite">正在读取存档</output></section>
<output id="status" aria-live="polite"></output></main><script src="simulation.js"></script><script src="main.js"></script><script src="game.js"></script><script src="audio.js"></script></body></html>
