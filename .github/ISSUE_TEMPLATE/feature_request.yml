name: 需求或规范同步
description: 教程、方案、接口同步与开发工具需求
title: '[Request] '
body:
  - type: textarea
    id: goal
    attributes:
      label: 使用场景与目标
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与来源
      description: 受影响文档、示例、Skills；宿主联动请列来源文件及作者可见行为。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
    validations:
      required: true
